const qs=id=>document.getElementById(id),fish=qs('fish'),web=qs('web');qs('skin').src='data:image/png;base64,'+imageData;
function layout(){let v={x:+qs('x').value,y:+qs('y').value,w:+qs('w').value,h:+qs('h').value};for(let k of Object.keys(v))v[k]=Math.max(0,Math.min(100,v[k]||0));web.style.left=v.x+'%';web.style.top=v.y+'%';web.style.width=Math.min(v.w,100-v.x)+'%';web.style.height=Math.min(v.h,100-v.y)+'%'}
for(let id of ['x','y','w','h'])qs(id).addEventListener('input',layout);layout();
function go(){let t=qs('entry').value.trim();if(!t)return;try{let u=new URL(/^https?:\/\//i.test(t)?t:'https://'+t);if(!['https:','http:'].includes(u.protocol))throw Error();qs('url').value=u.href;web.src=u.href;}catch{alert('请输入 http 或 https 网址')}}
qs('go').onclick=go;qs('url').onkeydown=e=>{if(e.key==='Enter'){qs('entry').value=qs('url').value;go()}};qs('reload').onclick=()=>{if(web.src)web.src=web.src};qs('close').onclick=()=>web.removeAttribute('src');qs('back').onclick=()=>alert('正式桌面版可使用后退导航，HTML 预览版不支持读取跨网站历史记录');
qs('pick').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>15*1024*1024)return alert('图片不能超过 15 MB');let reader=new FileReader();reader.onload=()=>qs('skin').src=reader.result;reader.readAsDataURL(f)};
function restore(){qs('skin').src='data:image/png;base64,'+imageData;for(let [id,val] of Object.entries({x:6.2,y:21.3,w:87.6,h:47.1}))qs(id).value=val;fish.style.width='354px';fish.style.height='376px';layout()}
qs('reset').onclick=()=>qs('skin').src='data:image/png;base64,'+imageData;qs('default').onclick=restore;
</script></body></html>
