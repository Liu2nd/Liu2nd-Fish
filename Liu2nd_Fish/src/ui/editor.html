<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';">
<title>Liu2nd_Fish 设置</title><link rel="stylesheet" href="./editor.css"></head>
<body>
<header><strong>Liu2nd_Fish</strong><span>皮肤 · 网页区域 · 快捷键 · 窗口设置</span></header>
<div id="app">
  <section class="left">
    <div class="heading"><strong>皮肤预览</strong><small>拖动绿色矩形移动网页区域，右下角缩放</small></div>
    <div id="preview-board"><div id="preview-stage"><img id="preview-skin" alt="背景图片" draggable="false"><div id="view-rect"><span>真实网页区域</span><i id="handle" title="调整网页区域大小"></i></div></div></div>
    <div class="button-row"><button type="button" id="pick">导入背景图片</button><button type="button" id="restore">恢复默认皮肤</button></div>
    <small id="skin-name">默认皮肤</small>
    <div class="note">预览框是定位工具；主窗口中央是真正的浏览器，不是截图或广告图片。</div>
  </section>
  <section class="right">
    <div class="heading"><strong>网站地址</strong><small>在程序内修改，立即在中间区域打开</small></div>
    <form id="url-form" class="url-form"><input id="website-url" type="text" spellcheck="false" placeholder="https://www.bilibili.com" aria-label="网站地址"><button type="submit">打开网页</button></form>
    <div class="heading spaced"><strong>网页显示区域</strong><small>单位：皮肤设计像素</small></div>
    <div class="inputs two">
      <label>左边 X<input id="web-x" type="number" min="0"></label>
      <label>顶部 Y<input id="web-y" type="number" min="0"></label>
      <label>宽度 W<input id="web-w" type="number" min="60"></label>
      <label>高度 H<input id="web-h" type="number" min="60"></label>
    </div>
    <div class="heading spaced"><strong>窗口大小</strong><small>可在主窗口右下角直接拖动</small></div>
    <div class="inputs two">
      <label>窗口宽度<input id="window-w" type="number" min="290" max="2400"></label>
      <label>窗口高度<input id="window-h" type="number" min="290" max="1800"></label>
    </div>
    <div class="heading spaced"><strong>皮肤尺寸</strong><small>导入图片后仍可手动设置</small></div>
    <div class="inputs two">
      <label>皮肤原始宽<input id="design-w" type="number" min="160" max="4096"></label>
      <label>皮肤原始高<input id="design-h" type="number" min="160" max="4096"></label>
    </div>
    <div class="heading spaced"><strong>显示方式</strong></div>
    <label class="horizontal"><span>缩放模式</span><select id="fit"><option value="contain">保持比例，不拉伸背景</option><option value="stretch">填满窗口（可能变形）</option></select></label>
    <label class="horizontal"><span>窗口透明度</span><input id="opacity" type="range" min="35" max="100" step="5"><output id="opacity-value">100%</output></label>
    <label class="checkbox"><input id="topmost" type="checkbox">窗口始终置顶</label>
    <label class="checkbox"><input id="mute" type="checkbox">隐藏时自动静音</label>
    <label class="checkbox"><input id="muted" type="checkbox">网页当前静音</label>
    <div class="heading spaced"><strong>全局快捷键</strong><small>点击输入框，然后按下组合键；自动保存</small></div>
    <div class="hotkey-list">
      <div class="hotkey-row" data-hotkey="toggleWindow"><label for="hotkey-toggleWindow">显示 / 隐藏窗口</label><input id="hotkey-toggleWindow" class="hotkey-input" readonly aria-label="录入显示隐藏快捷键" placeholder="点击后按组合键"><button type="button" data-shortcut-clear="toggleWindow">停用</button><button type="button" data-shortcut-reset="toggleWindow">默认</button><small id="hotkey-status-toggleWindow"></small></div>
      <div class="hotkey-row" data-hotkey="toggleMute"><label for="hotkey-toggleMute">切换网页静音</label><input id="hotkey-toggleMute" class="hotkey-input" readonly aria-label="录入静音快捷键" placeholder="点击后按组合键"><button type="button" data-shortcut-clear="toggleMute">停用</button><button type="button" data-shortcut-reset="toggleMute">默认</button><small id="hotkey-status-toggleMute"></small></div>
      <div class="hotkey-row" data-hotkey="openSettings"><label for="hotkey-openSettings">打开设置窗口</label><input id="hotkey-openSettings" class="hotkey-input" readonly aria-label="录入打开设置快捷键" placeholder="点击后按组合键"><button type="button" data-shortcut-clear="openSettings">停用</button><button type="button" data-shortcut-reset="openSettings">默认</button><small id="hotkey-status-openSettings"></small></div>
    </div>
    <div class="shortcut">支持 Alt、Ctrl / Cmd、Shift 加字母、数字或 F1–F12；按 Esc 取消录制。被系统占用时保留原快捷键；停用后仍可使用系统托盘。部分快捷键在不同系统上可能受限。</div>
    <div class="button-row lower"><button id="show">返回浏览窗口</button><button id="reset-rect">恢复默认网页位置</button></div>
    <div id="message" role="status"></div>
  </section>
</div>
<script src="./editor.js"></script></body></html>
