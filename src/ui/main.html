<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';">
<title>Liu2nd_Fish</title><link rel="stylesheet" href="./main.css">
</head>
<body>
<div id="stage" aria-label="Liu2nd_Fish 广告伪装皮肤">
  <img id="skin" alt="广告皮肤" draggable="false">
  <form id="address-form" autocomplete="off" title="输入网站地址并回车">
    <input id="address" aria-label="网址" spellcheck="false" placeholder="https://...">
    <button id="close" type="button" title="隐藏到托盘">×</button>
  </form>
  <div id="drag-strip" title="按住拖动窗口"></div>
  <div id="button-strip">
    <button id="back" title="后退" type="button">◀</button>
    <button id="refresh" title="刷新" type="button">⟳</button>
    <button id="settings" title="更换皮肤 / 调整网页区域" type="button">⚙</button>
    <button id="hide" title="隐藏（Alt+Q）" type="button">×</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</div>
<div id="resize-grip" title="拖动调整整个窗口大小" aria-label="调整整个窗口大小">⌟</div>
<script src="./main.js"></script>
</body></html>
